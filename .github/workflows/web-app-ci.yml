name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/demo_run.py --test
      - run: python job-outreach/automation/test_url_safety.py
      - run: python acting-career-automation/scripts/parse_leads.py
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/server/package.json
      - run: npm install
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/client/package.json
      - run: npm install
      - run: npm test -- --watchAll=false
      - run: npm run build
