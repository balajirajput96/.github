name: Web App CI

on:
  push:
    branches: [main]
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-ci.yml'
  pull_request:
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-ci.yml'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/server/package.json
      - run: npm install
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/client/package.json
      - run: npm install
      - run: npm test -- --watchAll=false
      - run: npm run build
