name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python scripts/demo_run.py --test
      - run: python job-outreach/automation/test_url_safety.py
      - run: python acting-career-automation/scripts/parse_leads.py
      - run: python -m pytest -q test_main.py

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
