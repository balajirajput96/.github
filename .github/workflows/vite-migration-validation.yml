name: Validate dashboard Vite migration

on:
  push:
    branches:
      - hardening/client-vite-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/client
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and regenerate lockfile
        run: npm install
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=moderate
      - name: Run dashboard tests
        run: npm test
      - name: Build dashboard
        run: npm run build
      - name: Publish validated migration
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vite-migration-validation.yml
          git add web-app/client/package.json web-app/client/package-lock.json web-app/client/vite.config.mjs web-app/client/index.html web-app/client/src/index.js web-app/client/src/setupTests.js web-app/client/src/components/ErrorBoundary.test.js web-app/server/package.json .github/workflows/vite-migration-validation.yml
          git diff --cached --quiet && { echo 'No validated migration changes to commit.'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(client): modernize dashboard build and test toolchain'
          git push origin HEAD:hardening/client-vite-20260901
