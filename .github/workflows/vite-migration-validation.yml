name: Validate dashboard Vite migration

on:
  push:
    branches:
      - hardening/client-vite-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/client
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and regenerate lockfile
        run: npm install
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=moderate
      - name: Run dashboard tests
        run: npm test
      - name: Build dashboard
        run: npm run build
      - name: Publish lockfile and remove validation workflow
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vite-migration-validation.yml
          git add web-app/client/package.json web-app/client/package-lock.json .github/workflows/vite-migration-validation.yml
          if git diff --cached --quiet; then
            echo 'No lockfile changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(client): commit audited npm lockfile'
          git push origin HEAD:hardening/client-vite-20260901
