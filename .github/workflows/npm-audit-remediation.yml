name: Temporary npm audit remediation

on:
  push:
    branches:
      - hardening/npm-audit-20260901

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Remediate npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web-app/server install
          npm --prefix web-app/server audit fix
          npm --prefix web-app/client install
          npm --prefix web-app/client audit fix
          npm --prefix web-app/server test
          npm --prefix web-app/client test -- --watchAll=false
          npm --prefix web-app/client run build
      - name: Publish remediation commit once
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/npm-audit-remediation.yml
          git add web-app/server/package.json web-app/server/package-lock.json web-app/client/package.json web-app/client/package-lock.json .github/workflows/npm-audit-remediation.yml
          if git diff --cached --quiet; then
            echo 'No dependency changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): remediate npm audit findings'
          git push origin HEAD:hardening/npm-audit-20260901
